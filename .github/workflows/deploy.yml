# CD — main push 의 CI 성공 후 웹(프론트)만 NCP 서버에 배포.
#
# 범위: koscomlabor-web 컨테이너 재빌드·재기동 (deploy.sh).
# API(server/)는 CD 제외 — Part 2 배포 보류·.env 선행 조건 때문 (수동 배포, 07 문서).
#
# SSH 키는 command 제한 배포 전용 키 (rsync → /root/koscomlabor-web/src/ 와
# deploy.sh 실행만 허용 — 서버의 deploy-key-wrapper.sh).
#
# 배포 설정(deploy/web/docker-compose.yml)도 이 rsync 로 함께 올라가며, 서버 deploy.sh 가
# 빌드 직전 루트로 복사한다. deploy.sh 자체는 자동 동기화 대상이 아니다 (07 문서 §12).
name: Deploy Web

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-web-production
  cancel-in-progress: false # 진행 중 배포는 끊지 않는다 (반쪽 배포 방지)

jobs:
  deploy:
    name: deploy web to NCP
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: SSH 설정 (배포 키 + 고정 known_hosts, StrictHostKeyChecking 유지)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cp .github/known_hosts ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host ncp
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      # deploy/ 는 제외하지 않는다 — 배포 설정(deploy/web/docker-compose.yml)이 서버로 가는
      # 유일한 경로다. 배포 키가 src/ 하위에만 쓸 수 있어(command 제한) 루트에 직접 못 올린다.
      # 도착한 src/deploy/web/docker-compose.yml 은 서버 deploy.sh 가 루트로 복사한다 (07 §12).
      # 컨테이너 빌드 컨텍스트에는 .dockerignore 의 deploy 항목이 그대로 막아 준다.
      - name: rsync 소스 동기화 (배포 설정 deploy/ 포함)
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .next --exclude .git --exclude .idea --exclude .claude \
            --exclude _workspace --exclude server --exclude "*.pem" --exclude ".env*" \
            --exclude tsconfig.tsbuildinfo --exclude design --exclude .github \
            ./ ncp:/root/koscomlabor-web/src/

      - name: 배포 실행 (재빌드·재기동)
        run: ssh ncp /root/koscomlabor-web/deploy.sh

      - name: 헬스 확인 (https://koscomlabor.cloud 200)
        run: |
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://koscomlabor.cloud/ || echo 000)
            echo "attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "헬스 체크 실패" >&2
          exit 1
