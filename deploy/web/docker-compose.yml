# 프론트(Next.js) 프로덕션 배포 구성 (NCP VM, Docker 기반).
#
# 이 파일이 프론트 배포 설정의 단일 출처다 (07 문서 §12).
# 저장소는 /root/koscomlabor-web/src/ 로 rsync 되고(node_modules·.next·.git·_workspace·server 제외),
# 이 파일도 src/deploy/web/ 로 함께 올라간 뒤 서버 deploy.sh 가 빌드 직전
# /root/koscomlabor-web/docker-compose.yml 로 복사한다. 서버 파일을 손으로 고치지 말 것 —
# 다음 배포 때 이 파일 내용으로 덮어써진다.
#
# NEXT_PUBLIC_API_BASE_URL·NEXT_PUBLIC_NAVER_MAP_CLIENT_ID 은 빌드타임 임베드 — 값 변경 시 재빌드 필요.
# 외부 노출은 onnuri-caddy(443) 경유만 (호스트 포트 미개방, deploy_web 네트워크 공유).

name: koscomlabor-web

services:
  web:
    build:
      context: ./src
      args:
        NEXT_PUBLIC_API_BASE_URL: https://union-api.koscomlabor.cloud
        # 네이버 지도 Client ID (NCP → Maps → Application). 서비스 URL 로 koscomlabor.cloud 와
        # localhost 가 등록돼 있다. 값이 비면 /rally-2026-08-28 의 지도 블록이 렌더되지 않는다.
        NEXT_PUBLIC_NAVER_MAP_CLIENT_ID: x79smqla3u
        BUILD_DATE: dev   # deploy.sh 가 --build-arg BUILD_DATE=$(date +%F) 로 덮어씀 (일일 재빌드 캐시 버스트)
    image: koscomlabor-web:latest
    container_name: koscomlabor-web
    restart: unless-stopped
    networks: [deploy_web]

networks:
  deploy_web:
    external: true
