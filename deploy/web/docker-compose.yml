# 프론트(Next.js) 프로덕션 배포 구성 (NCP VM, Docker 기반).
#
# 서버 배치: 이 파일은 /root/koscomlabor-web/docker-compose.yml 로 복사되고,
# 저장소는 /root/koscomlabor-web/src/ 로 rsync 된다 (node_modules·.next·.git·_workspace·server 제외).
#
# NEXT_PUBLIC_API_BASE_URL 은 빌드타임 임베드 — 값 변경 시 재빌드 필요.
# 외부 노출은 onnuri-caddy(443) 경유만 (호스트 포트 미개방, deploy_web 네트워크 공유).

name: koscomlabor-web

services:
  web:
    build:
      context: ./src
      args:
        NEXT_PUBLIC_API_BASE_URL: https://union-api.koscomlabor.cloud
        BUILD_DATE: dev   # deploy.sh 가 --build-arg BUILD_DATE=$(date +%F) 로 덮어씀 (일일 재빌드 캐시 버스트)
    image: koscomlabor-web:latest
    container_name: koscomlabor-web
    restart: unless-stopped
    networks: [deploy_web]

networks:
  deploy_web:
    external: true
